<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="todo-styles.css">
</head>
<body>
    <div class="todo-container">
        <header class="todo-header">
            <h1>✓ My Tasks</h1>
            <p class="subtitle">Stay organized with local storage persistence</p>
        </header>

        <div class="todo-card">
            <div class="input-section">
                <input 
                    type="text" 
                    id="todo-input" 
                    class="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="add-btn" class="btn btn-add">Add Task</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul id="todo-list" class="todo-list">
                <li class="placeholder">No tasks yet. Add one to get started!</li>
            </ul>

            <div class="stats-section">
                <span id="total-tasks">Total: 0</span>
                <span id="completed-tasks">Completed: 0</span>
            </div>

            <div class="action-buttons">
                <button id="clear-completed-btn" class="btn btn-secondary btn-small">
                    Clear Completed
                </button>
                <button id="clear-all-btn" class="btn btn-secondary btn-small">
                    Clear All
                </button>
            </div>
        </div>

        <footer class="todo-footer">
            <p>💾 Your tasks are saved locally in your browser</p>
            <p class="disclaimer">Data persists even after closing the browser</p>
        </footer>
    </div>

    <script src="todo-script.js"></script>
</body>
</html>
